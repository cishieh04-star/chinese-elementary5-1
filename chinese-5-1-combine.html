<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>蚊帳大使夢想大冒險・五年級第一課</title>
<style>:root{
  --sky1:#7fd6ff;--sky2:#c9f0ff;--grass:#7ddc6a;--grass2:#4fbf4a;--sun:#ffd84d;--sun2:#ffb703;
  --coral:#ff6b6b;--coral2:#e04848;--blue:#3b9cff;--blue2:#1f78e0;--green:#3ecf72;--green2:#22a653;
  --purple:#9b6bff;--purple2:#7647e0;--ink:#2b3a55;--ink2:#5a6b8c;--card:#ffffff;--line:#d8e6f7;
  --bg:#e8f6ff;--shadow:0 .35rem 0 rgba(30,60,110,.18);--fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(clamp(14px,calc(.6vw + 1.2vh + 6px),32px)*var(--fs));height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-weight:700;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:.22rem solid var(--purple);outline-offset:.15rem}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:scr .25s ease}
@keyframes scr{from{opacity:0;transform:translateY(.6rem)}to{opacity:1;transform:none}}
ruby{ruby-position:over}
rt{font-size:.46em;font-weight:700;color:#d0301f;letter-spacing:0;user-select:none}
.zy-off rt{display:none}
.zy-on ruby{ruby-align:center}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:3rem;padding:.55rem 1.3rem;border-radius:1.1rem;
  background:var(--sun);color:#5a3b00;font-size:1.15rem;font-weight:900;box-shadow:0 .3rem 0 var(--sun2);position:relative;top:0;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(.28rem);box-shadow:0 .02rem 0 var(--sun2)}
.btn.g{background:var(--green);color:#fff;box-shadow:0 .3rem 0 var(--green2)}
.btn.g:active:not(:disabled){box-shadow:0 .02rem 0 var(--green2)}
.btn.b{background:var(--blue);color:#fff;box-shadow:0 .3rem 0 var(--blue2)}
.btn.b:active:not(:disabled){box-shadow:0 .02rem 0 var(--blue2)}
.btn.r{background:var(--coral);color:#fff;box-shadow:0 .3rem 0 var(--coral2)}
.btn.r:active:not(:disabled){box-shadow:0 .02rem 0 var(--coral2)}
.btn.p{background:var(--purple);color:#fff;box-shadow:0 .3rem 0 var(--purple2)}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 .3rem 0 #b9cde6}
.btn.w:active:not(:disabled){box-shadow:0 .02rem 0 #b9cde6}
.btn.big{font-size:1.3rem;min-height:3.6rem;padding:.6rem 1.3rem;border-radius:1.3rem}
.btn.sm{min-height:2.4rem;padding:.3rem .8rem;font-size:.95rem;border-radius:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ibtn{width:2.8rem;height:2.8rem;border-radius:50%;background:#fff;box-shadow:0 .22rem 0 #b9cde6;font-size:1.3rem;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn:active{transform:translateY(.2rem);box-shadow:none}
.ibtn.on{background:var(--sun);box-shadow:0 .22rem 0 var(--sun2)}
/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:.5rem;padding:.55rem .7rem;flex:none;flex-wrap:wrap;background:linear-gradient(#fff,#eaf6ff);border-bottom:.2rem solid var(--line);z-index:5}
.hud .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .75rem;border-radius:999px;background:#fff;border:.15rem solid var(--line);font-size:1rem;font-weight:900;white-space:nowrap}
.pill.lv{background:var(--purple);color:#fff;border-color:var(--purple2)}
.pill.coin{background:#fff6cc;border-color:#ffe07a}
.pill.net{background:#dcfbe6;border-color:#9fe6b6}
.xpbar{width:5.5rem;height:.7rem;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden;display:inline-block}
.xpbar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.hearts{display:inline-flex;gap:.15rem;font-size:1.3rem}
.hearts .lost{filter:grayscale(1);opacity:.35}
.title-h{font-size:1.25rem;font-weight:900;display:flex;align-items:center;gap:.4rem}
/* ---------- title screen ---------- */
.title-scr{background:linear-gradient(#7fd6ff 0%,#c9f0ff 55%,#bff3c0 55%,#7ddc6a 100%);align-items:center;text-align:center;padding:1rem;overflow:auto}
.title-scr>div{position:relative;z-index:1}
.title-scr .logo{font-size:min(3.4rem,11vw);font-weight:900;color:#fff;text-shadow:0 .25rem 0 var(--blue2),0 .5rem 0 rgba(0,0,0,.12);line-height:1.15;letter-spacing:.05em}
.title-scr .sub{display:inline-block;margin:.4rem 0 .8rem;padding:.3rem 1rem;background:var(--sun);border-radius:99px;color:#5a3b00;font-weight:900;box-shadow:0 .2rem 0 var(--sun2)}
.title-card{background:#fff;border-radius:1.6rem;padding:1rem 1.2rem;box-shadow:var(--shadow);max-width:34rem;width:100%}
.avatars{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:.5rem 0}
.avatars button{width:3.1rem;height:3.1rem;border-radius:1rem;font-size:1.8rem;background:#f0f7ff;border:.2rem solid transparent}
.avatars button.sel{border-color:var(--purple);background:#efe6ff;transform:scale(1.1)}
.nameinp{width:100%;font:inherit;font-size:1.3rem;padding:.6rem 1rem;border-radius:1rem;border:.2rem solid var(--line);text-align:center;font-weight:800;color:var(--ink);background:#fff;user-select:text}
.nameinp:focus{outline:none;border-color:var(--blue)}
.cloud{pointer-events:none;z-index:0;position:absolute;font-size:3rem;opacity:.9;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
/* ---------- hub map ---------- */
.hub{background:linear-gradient(#8fdcff 0%,#d9f4ff 38%,#c4f2b8 38%,#8be07a 100%)}
.mapwrap{flex:1;position:relative;overflow:auto;min-height:0}
.map{position:relative;width:100%;height:100%;min-height:26rem;min-width:min(100%,60rem);margin:0 auto}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.deco{position:absolute;font-size:2.4rem;pointer-events:none;opacity:.95}
.node{background:none;border:0;padding:0;font:inherit;color:inherit;position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.15rem;width:7.6rem;z-index:2}
.node .orb{width:4.6rem;height:4.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;
  background:radial-gradient(circle at 30% 25%,#fff8c8,var(--sun) 55%,var(--sun2));border:.28rem solid #fff;box-shadow:0 .4rem 0 rgba(30,60,110,.25);transition:transform .15s}
.node:hover .orb{transform:scale(1.08)}
.node:active .orb{transform:scale(.95)}
.node.cur .orb{animation:bob 1.1s ease-in-out infinite;box-shadow:0 0 0 .35rem rgba(255,255,255,.7),0 .4rem 0 rgba(30,60,110,.25)}
.node.lock .orb{background:radial-gradient(circle at 30% 25%,#eee,#bbb 60%,#999);filter:grayscale(.4)}
.node.boss .orb{width:5.6rem;height:5.6rem;font-size:3rem;background:radial-gradient(circle at 30% 25%,#ffd0d0,var(--coral) 60%,var(--coral2))}
.node .nm{background:#fff;border-radius:.8rem;padding:.1rem .6rem;font-size:.95rem;font-weight:900;box-shadow:0 .15rem 0 rgba(30,60,110,.18);text-align:center;line-height:1.25}
.node .sk{font-size:.72rem;color:var(--ink2);font-weight:800;text-align:center;line-height:1.1;background:rgba(255,255,255,.8);border-radius:.5rem;padding:0 .3rem}
.stars{font-size:1.05rem;letter-spacing:.05rem;filter:drop-shadow(0 .08rem 0 rgba(0,0,0,.2))}
.stars .off{filter:grayscale(1);opacity:.35}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.45rem)}}
.netty{position:absolute;z-index:3;display:flex;align-items:flex-end;gap:.4rem;pointer-events:none}
.netty .bubble{background:#fff;border-radius:1rem;padding:.45rem .8rem;font-size:.95rem;max-width:15rem;box-shadow:var(--shadow);position:relative;pointer-events:auto}
.netty svg{width:4.6rem;height:4.6rem;animation:bob 2.2s ease-in-out infinite;flex:none}
.dock{display:flex;gap:.5rem;padding:.55rem .6rem;justify-content:center;flex-wrap:wrap;flex:none;background:linear-gradient(#fff,#eaf6ff);border-top:.2rem solid var(--line)}
.dock .btn{flex:1;max-width:10rem;min-width:5.5rem;padding:.4rem .5rem;font-size:1rem}
/* ---------- generic page ---------- */
.page{flex:1;overflow:auto;padding:.9rem;min-height:0}
.wrap{max-width:60rem;margin:0 auto;width:100%}
.card{background:var(--card);border-radius:1.2rem;padding:.9rem 1rem;box-shadow:var(--shadow);margin-bottom:.8rem}
.card h3{margin:.1rem 0 .4rem;font-size:1.15rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.7rem}
.tab{padding:.45rem 1rem;border-radius:99px;background:#fff;border:.15rem solid var(--line);font-weight:900;font-size:1rem}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue2)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.55rem .2rem;border-bottom:.1rem dashed var(--line)}
.sw:last-child{border:0}
.sw small{display:block;font-size:.8rem;color:var(--ink2);font-weight:700}
.toggle{width:3.6rem;height:2rem;border-radius:99px;background:#c9d6e8;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 .1rem .2rem rgba(0,0,0,.25)}
.toggle.on{background:var(--green)}
.toggle.on::after{left:1.8rem}
.seg{display:inline-flex;border-radius:.9rem;overflow:hidden;border:.15rem solid var(--line)}
.seg button{padding:.35rem .8rem;background:#fff;font-weight:900}
.seg button.on{background:var(--blue);color:#fff}
.hint{font-size:.9rem;color:var(--ink2);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{padding:.25rem .7rem;border-radius:99px;background:#eef5ff;border:.12rem solid var(--line);font-size:.95rem;font-weight:800}
/* ---------- stage screen ---------- */
.stage{background:linear-gradient(#e9f7ff,#f6fff0)}
.stagebody{flex:1;position:relative;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:.7rem .8rem .9rem;gap:.6rem;align-items:stretch}
.inst{background:#fff;border-radius:1rem;padding:.55rem .9rem;font-size:1.05rem;box-shadow:0 .2rem 0 rgba(30,60,110,.12);display:flex;align-items:center;gap:.5rem;flex:none}
.inst .em{font-size:1.6rem}
.prog{height:.8rem;background:#d6e6f7;border-radius:99px;overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#9be564);border-radius:99px;transition:width .4s}
/* MCQ */
.qcard{background:#fff;border-radius:1.3rem;padding:1rem 1.1rem;box-shadow:var(--shadow);font-size:1.35rem;line-height:2.3;display:flex;gap:.6rem;align-items:flex-start}
.qcard .qt{flex:1;min-width:0;overflow-wrap:anywhere}
.qcard .sp{flex:none}
.opts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.7rem}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{background:#fff;border-radius:1.1rem;padding:.7rem .9rem;text-align:left;font-size:1.2rem;line-height:1.9;box-shadow:0 .3rem 0 #b9cde6;border:.18rem solid transparent;display:flex;gap:.6rem;align-items:center;min-height:3.4rem;transition:transform .08s}
.opt:active:not(:disabled){transform:translateY(.25rem);box-shadow:0 .03rem 0 #b9cde6}
.opt .k{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:900}
.opt.ok{background:#d9f9e3;border-color:var(--green);box-shadow:0 .3rem 0 var(--green2)}
.opt.ok .k{background:var(--green)}
.opt.bad{background:#ffe0e0;border-color:var(--coral);box-shadow:0 .3rem 0 var(--coral2);animation:shake .35s}
.opt.bad .k{background:var(--coral)}
.opt.gone{opacity:.25;pointer-events:none}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-.4rem)}75%{transform:translateX(.4rem)}}
@media(max-width:34rem){.opts{grid-template-columns:minmax(0,1fr)}}
.skilltag{display:inline-block;font-size:.8rem;background:#efe6ff;color:var(--purple2);border-radius:99px;padding:.05rem .6rem;font-weight:900;margin-right:.4rem;vertical-align:middle}
.mark{background:#fff0a8;border-radius:.4rem;padding:0 .15rem}
.blank{display:inline-block;min-width:2.4em;border-bottom:.18rem solid var(--ink);text-align:center;color:var(--purple2)}
/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(20,40,80,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:46rem;background:#fff;border-radius:1.6rem 1.6rem 0 0;padding:1rem 1.2rem 1.1rem;box-shadow:0 -.4rem 1.2rem rgba(0,0,0,.2);animation:up .28s cubic-bezier(.2,1.3,.5,1);max-height:80%;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .hd{display:flex;align-items:center;gap:.6rem;font-size:1.5rem;font-weight:900;margin-bottom:.3rem}
.sheet.ok .hd{color:var(--green2)}
.sheet.bad .hd{color:var(--coral2)}
.sheet .body{font-size:1.15rem;line-height:2.2;margin:.2rem 0 .7rem}
.sheet .ans{background:#f0f7ff;border-radius:.9rem;padding:.4rem .8rem;margin:.3rem 0;font-size:1.1rem;line-height:2.1}
.modalbg{position:fixed;inset:0;background:rgba(20,40,80,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fade .2s}
.modal{background:#fff;border-radius:1.5rem;padding:1.1rem 1.3rem;max-width:30rem;width:100%;box-shadow:var(--shadow);text-align:center;max-height:92%;overflow:auto}
.modal h2{margin:.2rem 0 .4rem;font-size:1.5rem}
.modal .row{justify-content:center;margin-top:.8rem}
.toast{position:fixed;left:50%;top:5rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5rem 1.1rem;border-radius:99px;font-size:1.05rem;z-index:70;animation:toast 2.2s forwards;pointer-events:none;text-align:center;max-width:90vw}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-.8rem)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.pop{position:fixed;z-index:65;pointer-events:none;font-weight:900;font-size:1.6rem;color:var(--sun2);text-shadow:0 .1rem 0 #fff,0 0 .3rem #fff;animation:popup .9s forwards}
@keyframes popup{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-3rem) scale(1.3)}}
.conf{position:fixed;top:-2rem;font-size:1.8rem;z-index:80;pointer-events:none;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
/* result */
.result{align-items:center;justify-content:center;text-align:center;padding:1rem;background:linear-gradient(#fff7d1,#e6f7ff);overflow:auto}
.result .big{font-size:3.2rem;margin:.2rem 0}
.result .stars{font-size:3rem}
.result .rows{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin:.6rem 0}
.result .rows .pill{font-size:1.15rem;padding:.4rem 1rem}
/* ---------- S1 swat ---------- */
.wall{background:#fff;border-radius:1.4rem;padding:1.2rem .6rem;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:.25rem .15rem;justify-content:center;position:relative;overflow:hidden;font-size:2.2rem;line-height:1.1}
.chtile{min-width:2.4rem;padding:.2rem .1rem .1rem;border-radius:.7rem;background:#f4f9ff;font-size:2.1rem;text-align:center;box-shadow:0 .18rem 0 #c9d9ee;position:relative;line-height:1.6}
.chtile.punc{background:none;box-shadow:none;min-width:1rem;pointer-events:none}
.chtile:active:not(.punc){transform:translateY(.15rem)}
.chtile.hit{background:#ffe0e0;box-shadow:0 .18rem 0 var(--coral2)}
.chtile.fine{background:#d9f9e3;box-shadow:0 .18rem 0 var(--green2)}
.chtile.nope{animation:shake .35s;background:#fff0c9}
.mos{position:absolute;font-size:1.8rem;pointer-events:none;animation:fly 6s linear infinite;opacity:.8}
@keyframes fly{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(4rem,-1rem) rotate(15deg)}50%{transform:translate(1rem,1.5rem) rotate(-10deg)}75%{transform:translate(-3rem,-.5rem) rotate(8deg)}100%{transform:translate(0,0) rotate(0)}}
.palette{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
.pchar{min-width:4rem;height:4.2rem;border-radius:1.1rem;background:#fff;box-shadow:0 .3rem 0 #b9cde6;font-size:2.1rem;font-weight:900;border:.18rem solid transparent;padding:0 .6rem;line-height:1.5}
.pchar.sel{background:#efe6ff;border-color:var(--purple);box-shadow:0 .3rem 0 var(--purple2);transform:translateY(-.2rem)}
.pchar.ok{background:#d9f9e3;border-color:var(--green)}
.pchar.bad{background:#ffe0e0;border-color:var(--coral);animation:shake .35s}
.pchar.gone{opacity:.25;pointer-events:none}
/* ---------- S2 match ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:.6rem}
.wtile .blank{min-width:1.3em}
.wtile{min-height:4.6rem;border-radius:1.1rem;background:linear-gradient(#fff,#eef6ff);box-shadow:0 .3rem 0 #b9cde6;font-size:1.5rem;font-weight:900;border:.18rem solid transparent;padding:.2rem .3rem;line-height:1.9;transition:transform .15s,opacity .3s}
.wtile.pre{border-color:var(--purple);background:#f5eeff}
.wtile.popped{animation:pop .45s forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(4deg)}100%{transform:scale(0);opacity:0}}
.wtile.bad{animation:shake .35s;border-color:var(--coral);background:#ffe9e9}
.combo{font-size:1.2rem;color:var(--coral2);font-weight:900;min-height:1.6rem;text-align:center}
.soundtag{display:inline-flex;align-items:center;gap:.4rem;background:var(--purple);color:#fff;border-radius:99px;padding:.15rem 1rem;font-size:1.3rem}
/* ---------- S3 tower defense ---------- */
.td{position:relative;flex:1;min-height:15rem;background:linear-gradient(#bde9ff,#d8f7c8);border-radius:1.2rem;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.lane{flex:1;position:relative;border-bottom:.15rem dashed rgba(60,120,80,.3);min-height:4.6rem}
.lane:last-child{border:0}
.netbase{position:absolute;left:.2rem;top:0;bottom:0;width:3.2rem;display:flex;align-items:center;justify-content:center;font-size:2.2rem;background:rgba(255,255,255,.6);border-radius:0 1rem 1rem 0;z-index:1}
.enemy{position:absolute;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:.3rem;z-index:2;transition:filter .2s}
.enemy .m{font-size:2.3rem;animation:wob .5s ease-in-out infinite}
@keyframes wob{0%,100%{transform:translateY(-.15rem)}50%{transform:translateY(.15rem)}}
.enemy .say{background:#fff;border-radius:.9rem;padding:.2rem .7rem;font-size:1.05rem;line-height:2;box-shadow:0 .15rem 0 rgba(0,0,0,.15);width:min(22rem,60vw);border:.15rem solid transparent}
.enemy.focus .say{border-color:var(--purple);background:#f7f0ff}
.enemy.shot{animation:zap .4s forwards}
@keyframes zap{to{transform:translateY(-50%) scale(0);opacity:0}}
.senses{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;flex:none}
.sense{flex:1;min-width:9rem;max-width:20rem;background:#fff;border-radius:1.1rem;padding:.6rem .8rem;box-shadow:0 .3rem 0 #b9cde6;font-size:1.1rem;line-height:1.9;text-align:center;border:.18rem solid transparent}
.sense .k{display:block;font-size:.8rem;color:var(--blue2)}
.sense:active{transform:translateY(.25rem);box-shadow:none}
/* ---------- S4 runner ---------- */
.run{position:relative;flex:1;min-height:18rem;background:linear-gradient(#9fe0ff,#e8f9ff 40%,#8e8e9a 40%,#6e6e7a);border-radius:1.2rem;overflow:hidden;box-shadow:var(--shadow);touch-action:none}
.road{position:absolute;left:0;right:0;top:34%;bottom:0;display:flex}
.road .ln{flex:1;border-right:.2rem dashed rgba(255,255,255,.5);position:relative}
.road .ln:last-child{border:0}
.runner{position:absolute;bottom:.8rem;width:4.4rem;height:4.4rem;transform:translateX(-50%);transition:left .14s ease-out;z-index:5}
.runner svg{width:100%;height:100%;animation:bob .35s ease-in-out infinite}
.gate{position:absolute;display:flex;transform:translateY(-50%);left:0;right:0;z-index:3}

, "why": "「義賣」是為了公益而賣東西，「義」有公益、正義的意思；「議」是討論。", "src": "ex"}, {"id": "ty13", "s": "越來越多人想應她的呼籲，一起加入行列。", "wi": 5, "correct": "響", "wrong": "想", "opts": ["響", "想", "享", "像"], "why": "「響應」是回應別人的呼籲或號召；「想」是思考、想念。", "src": "ex"}, {"id": "ty14", "s": "她在社區的教堂發表演獎，讓大家明白蚊帳的重要。", "wi": 10, "correct": "講", "wrong": "獎", "opts": ["講", "獎", "蔣", "漿"], "why": "「演講」是對大家說話，是言字旁；「獎」是獎勵。", "src": "ex"}, {"id": "ty15", "s": "貝克漢收藏獎狀的消息，引起世人的關住。", "wi": 17, "correct": "注", "wrong": "住", "opts": ["注", "住", "主", "駐"], "why": "「關注」是關心並留意，和注意有關，所以用「注」。", "src": "ex"}, {"id": "ty16", "s": "蓋茲機金會決定捐出三百萬美元。", "wi": 2, "correct": "基", "wrong": "機", "opts": ["基", "機", "積", "激"], "why": "「基金會」的「基」是基礎、基本；「機」是機會、機器。", "src": "ex"}, {"id": "ty17", "s": "她很高興收到非洲孩子的來信，並且表示感射。", "wi": 19, "correct": "謝", "wrong": "射", "opts": ["謝", "射", "榭", "卸"], "why": "「感謝」是表達謝意，用言字旁的「謝」；「射」是發射。", "src": "ex"}, {"id": "ty18", "s": "老師用力的鼓厲同學，希望大家不要輕易放棄。", "wi": 6, "correct": "勵", "wrong": "厲", "opts": ["勵", "厲", "礪", "例"], "why": "「鼓勵」是給人信心、鼓舞努力，「勵」下面有「力」；「厲」是嚴厲。", "src": "ex"}, {"id": "ty19", "s": "蚊帳像一把保戶傘，守護了非洲孩子的生命。", "wi": 6, "correct": "護", "wrong": "戶", "opts": ["護", "戶", "獲", "穫"], "why": "「保護」是照顧、守護，要用言字旁的「護」；「戶」是門戶。", "src": "ex"}, {"id": "ty20", "s": "非洲有許多孩子因為感染瘧急而失去生命。", "wi": 12, "correct": "疾", "wrong": "急", "opts": ["疾", "急", "極", "及"], "why": "「瘧疾」是一種疾病，部首是病字旁的「疾」；「急」是急忙。", "src": "ex"}, {"id": "ty21", "s": "雖然只捐了一頂蚊帳，凱瑟琳還是覺得自已應該再多做一點。", "wi": 18, "correct": "己", "wrong": "已", "opts": ["己", "已", "巳", "乙"], "why": "「自己」的「己」開口，上面不封；「已」是已經，右邊封起來。", "src": "ex"}, {"id": "ty22", "s": "她相信只要全力已赴，年紀小也能改變世界。", "wi": 7, "correct": "以", "wrong": "已", "opts": ["以", "已", "己", "似"], "why": "「全力以赴」的「以」是用、拿的意思，整句是用盡全部力量去做；「已」是已經。", "src": "ex"}, {"id": "ty23", "s": "凱瑟琳收到協會記來的回信，信中感謝她的付出。", "wi": 7, "correct": "寄", "wrong": "記", "opts": ["寄", "記", "紀", "計"], "why": "「寄」是郵遞、傳送，用寶蓋頭；「記」是記錄、記得。", "src": "ex"}, {"id": "ty24", "s": "一封來自非洲的信，給了凱瑟琳極大的鼓舞，讓她更有自心。", "wi": 25, "correct": "信", "wrong": "心", "opts": ["信", " 是…", "conn": ["雖然", "但是"], "chunks": ["雖然只捐了一頂蚊帳", "但是凱瑟琳沒有就此滿足"], "tip": "先說讓步的事，再說轉折後的結果。", "src": "ex"}, {"id": "sn09", "pat": "因為…所以…", "conn": ["因為", "所以"], "chunks": ["因為蚊子會傳染瘧疾", "所以大家要使用蚊帳"], "tip": "「因為」說原因，「所以」說結果。", "src": "ex"}, {"id": "sn10", "pat": "如果…就…", "conn": ["如果", "就"], "chunks": ["如果沒有蚊帳", "孩子們就會被蚊子叮咬"], "tip": "「如果」先假設，「就」說假設成立後的結果。", "src": "ex"}, {"id": "sn11", "pat": "即使…也…", "conn": ["即使", "也"], "chunks": ["即使年紀還小", "也能做出改變世界的事"], "tip": "「即使」先讓一步，「也」表示結果不變。", "src": "ex"}, {"id": "sn12", "pat": "與其…不如…", "conn": ["與其", "不如"], "chunks": ["與其抱怨沒有辦法", "不如現在就開始行動"], "tip": "「與其」先說不好的選擇，「不如」說比較好的選擇。", "src": "ex"}, {"id": "sn13", "pat": "一邊…一邊…", "conn": ["一邊", "一邊"], "chunks": ["凱瑟琳一邊設計獎狀", "一邊寫信給捐款的人"], "tip": "同一個人同時做兩件事，用兩個「一邊」。", "src": "ex"}, {"id": "sn14", "pat": "不管…都…", "conn": ["不管", "都"], "chunks": ["不管是大人還是小孩", "都能為世界盡一份力"], "tip": "「不管」表示條件怎麼變都一樣，後面用「都」呼應。", "src": "ex"}], "read": [{"id": "c1", "title": "蚊帳大使來臺灣", "scene": "🎤 🌏", "npc": "📣", "text": "二〇一八年六月，被稱為「蚊帳大使」的美國女孩凱瑟琳來到臺灣演講，和大家分享她如何用小小的力量實現夢想。", "qs": [{"q": "為什麼凱瑟琳被封為「蚊帳大使」？", "opts": ["她接受蚊帳公司的代言委託。", "她為非洲孩童努力募集蚊帳。", "她購買了最多頂蚊帳。", "她覺得蚊帳對人類很重要。"], "ans": 1, "why": "凱瑟琳為了救助非洲孩子，努力募集蚊帳，所以人們稱她為「蚊帳大使」。", "src": "ws", "id": "c1q1"}, {"q": "凱瑟琳來到臺灣是為了做什麼？", "opts": ["參加蚊帳比賽", "發表演講，分享自己的故事", "購買蚊帳", "學習中文"], "ans": 1, "why": "課文開頭提到她來到臺灣發表演講，讓大家看見她努力實現夢想。", "src": "ex", "id": "c1q2"}]}, {"id": "c2", "title": "五歲的決心", "scene": "👧 🌍", "npc": "👩", "text": "二〇〇六年，五歲的凱瑟琳得知非洲平均每三十秒，就有一個孩子因為感染瘧疾而去世。她想到家裡三歲的弟弟，覺得好難過，驚慌的對媽媽說：「我們需要做點什麼！」", "qs": [{"q": "當凱瑟琳得知非洲孩子死於瘧疾，立刻決定要「做點什麼」幫助他們，可知她具有下列哪一項特質？", "opts": ["自信", "樂觀", "善良", "謙虛"], "ans": 2, "why": "她為遠方的孩子難過，並且立刻想幫忙，是善良、有同理心的表現。", "src": "ws", "id": "c2q1"}, {"q": "非洲平均每幾秒鐘，就有一個孩子因感染瘧疾而去世？", "opts": ["三秒", "十秒", "三十秒", "三百秒"], "ans": 2, "why": "課文寫「平均每三十秒，就有一個小孩因為感染瘧疾而去世」。", "src": "ex", "id": "c2q2"}, {"q": "凱瑟琳為什麼特別難過？", "opts": ["她自己也得了瘧疾", "她想到家中三歲的弟弟，覺得每個孩子的生命都很珍貴", "她擔心弟弟會被蚊子叮", "她被媽媽責罵了"], "ans": 1, "why": "她想到自己的弟弟，所以更能體會失去孩子的難過。", "src": "ex", "id": "c2q3"}]}, {"id": "c3", "title": "蚊帳的祕密", "scene": "🛏️ 💰", "npc": "👩", "text": "媽媽告訴她，瘧疾是蚊子傳染的，用藥水處理過的蚊帳可以保護人們，可是對當地居民來說太貴，買不起。凱瑟琳決定把學校的點心費和買玩具的錢存下來買蚊帳，媽媽也鼓勵她。", "qs": [{"q": "為什麼蚊帳可以預防瘧疾？", "opts": ["因為蚊帳很厚，可以擋風", "因為處理過的蚊帳能保護人不被蚊子叮咬", "因為蚊帳可以賣錢", "因為蚊帳會發出聲音趕走蚊子"], "ans": 1, "why": "瘧疾是蚊子傳染的，蚊帳擋住蚊子，就能降低被傳染的機會。", "src": "ex", "id": "c3q1"}, {"q": "為什麼非洲當地居民沒有蚊帳？", "opts": ["他們不喜歡蚊帳", "蚊帳對他們來說太貴，買不起", "他們不知道蚊子會傳染瘧疾", "蚊帳都賣完了"], "ans": 1, "why": "課文說這種蚊帳對當地居民來說太貴，他們買不起。", "src": "ex", "id": "c3q2"}, {"q": "凱瑟琳用什麼錢買蚊帳？", "opts": ["過年的紅包", "爸爸給的零用錢", "學校的點心費和買玩具的錢", "賣蚊子換來的錢"], "ans": 2, "why": "她決定把學校的點心費和買玩具的錢存下來買蚊帳。", "src": "ex", "id": "c3q3"}]}, {"id": "c4", "title": "第一頂蚊帳", "scene": "📮 🛏️", "npc": "📨", "text": "凱瑟琳和媽媽買了一頂大蚊帳，寄給專門為非洲孩子募集蚊帳的協會。收到回信後，她知道自己是最年輕的捐贈人，卻沒有笑。她說：雖然這三十秒沒有孩子死去，下一個三十秒還是有人會死。", "qs": [{"q": "凱瑟琳讀完回信，為什麼沒有露出笑容？", "opts": ["她覺得協會寫的信不友善", "她知道只捐一頂蚊帳不夠，還有很多孩子需要幫助", "她對自己是最年輕的捐贈人感到害羞", "她不想再捐了"], "ans": 1, "why": "她說下一個三十秒還是有人會死，表示她知道只靠一頂蚊帳還不夠。", "src": "ex", "id": "c4q1"}, {"q": "這一段可以看出凱瑟琳有什麼特質？", "opts": ["很快就滿足", "不輕易滿足，希望做得更多", "喜歡炫耀自己", "容易放棄"], "ans": 1, "why": "雖然已經捐出蚊帳，她仍想幫助更多孩子，可見她不輕易滿足。", "src": "ex", "id": "c4q2"}]}, {"id": "c5", "title": "義賣與獎狀", "scene": "🧸 🏅", "npc": "🧒", "text": "凱瑟琳知道還有很多人需要蚊帳，就和媽媽在二手市場義賣。她還自己設計獎狀：只要捐贈一頂蚊帳的錢，就能得到一張她親筆寫下的獎狀。", "qs": [{"q": "凱瑟琳設計獎狀的用意是什麼？", "opts": ["讓捐款的人覺得被感謝，也鼓勵更多人一起幫忙", "為了在學校得獎", "為了賣獎狀賺零用錢", "為了裝飾自己的房間"], "ans": 0, "why": "獎狀是對捐贈者的感謝與肯定，也讓更多人願意加入。", "src": "ex", "id": "c5q1"}, {"q": "「義賣」的意思是什麼？", "opts": ["為了做善事而賣東西，把所得拿來幫助別人", "用很便宜的價錢賣東西", "把舊東西丟掉", "把東西賣給朋友"], "ans": 0, "why": "「義」有公益的意思，義賣就是為公益而賣東西。", "src": "ex", "id": "c5q2"}]}, {"id": "c6", "title": "越來越多人加入", "scene": "🎪 👥", "npc": "🧑‍🤝‍🧑", "text": "人們被她的真誠打動，帶著孩子加入買蚊帳、做獎狀的行列。她到社區的教堂和各地演講，讓大家明白蚊帳就像保護傘，守護著非洲孩子的生命，許多人紛紛響應。", "qs": [{"q": "「蚊帳是保護傘」運用了什麼修辭？", "opts": ["譬喻", "擬人", "誇飾", "排比"], "ans": 0, "why": "把蚊帳比成保護傘，說明蚊帳能保護孩子不被蚊子叮咬，這是譬喻。", "src": "ex", "id": "c6q1"}, {"q": "人們為什麼願意加入她的行列？", "opts": ["因為她的真誠打動了大家", "因為她送每個人禮物", "因為學校規定要參加", "因為蚊帳很便宜"], "ans": 0, "why": "課文說人們被她的真誠打動，才加入行列。", "src": "ex", "id": "c6q2"}]}, {"id": "c7", "title": "足球明星的回應", "scene": "⚽ 📺", "npc": "⚽", "text": "有一天，凱瑟琳看見足球明星貝克漢為協會拍的廣告，立刻寄了一封信和獎狀向他道謝。貝克漢不但珍藏獎狀，還把獎狀的圖片貼到個人網站，引起世人的關注。", "qs": [{"q": "貝克漢收到獎狀後做了什麼？", "opts": ["把獎狀退還給凱瑟琳", "收藏獎狀，還把圖片貼到個人網站", "把獎狀送給別人", "沒有任何回應"], "ans": 1, "why": "貝克漢不但收藏獎狀，還把圖片貼到個人網站。", "src": "ex", "id": "c7q1"}, {"q": "「引起世人的關注」是什麼意思？", "opts": ["讓許多人注意到這件事", "讓大家覺得很生氣", "讓世人感到害怕", "讓大家忘記這件事"], "ans": 0, "why": "「關注」是關心並留意，引起世人關注就是讓很多人注意到。", "src": "ex", "id": "c7q2"}]}, {"id": "c8", "title": "來自非洲的信", "scene": "✉️ 💼", "npc": "💼", "text": "二〇〇七年六月，凱瑟琳收到一封來自非洲的信，孩子們感謝她送的蚊帳。這封信給了她極大的鼓舞，於是她和同伴製作一百張獎狀，連同信件寄給全球富豪，其中一封寫給比爾．蓋茲。", "qs": [{"q": "凱瑟琳為什麼要寫信給全球富豪？", "opts": ["因為富豪比較有能力捐出更多的錢買蚊帳", "因為富豪都認識她", "因為富豪要買獎狀", "因為富豪住在非洲"], "ans": 0, "why": "要買更多蚊帳需要更多錢，所以她把信寄給有能力捐助的富豪。", "src": "ex", "id": "c8q1"}, {"q": "非洲孩子的來信給凱瑟琳什麼樣的影響？", "opts": ["讓她覺得很失望", "讓她受到鼓舞，更有信心繼續努力", "讓她決定停止募款", "讓她感到害怕"], "ans": 1, "why": "課文說這封信給了她極大的鼓舞。", "src": "ex", "id": "c8q2"}]}, {"id": "c9", "title": "夢想成真", "scene": "🎈 🌍", "npc": "🎈", "text": "比爾．蓋茲深受感動，蓋茲基金會宣布捐助三百萬美元。凱瑟琳一步步實現夢想，這股力量像雪球般愈滾愈大，讓成千上萬的非洲兒童遠離瘧疾。她相信年紀小也能做善事，只要全力以赴，就能改變世界。", "qs": [{"q": "「這股夢想的力量如雪球般愈滾愈大」，這句話想說明什麼？", "opts": ["夢想的力量會慢慢變大，影響愈來愈多人", "夢想很容易失敗", "夢想是冰冷的", "雪球很好玩"], "ans": 0, "why": "這是譬喻：把夢想的力量比成雪球，雪球愈滾愈大，說明力量愈來愈大。", "src": "ex", "id": "c9q1"}, {"q": "蓋茲基金會捐助了多少錢？", "opts": ["三十萬美元", "三百萬美元", "三千萬美元", "三億美元"], "ans": 1, "why": "課文寫蓋茲基金會宣布捐助三百萬美元。", "src": "ex", "id": "c9q2"}, {"q": "〈蚊帳大使〉一文強調的重點是什麼？", "opts": ["製作獎狀和寫信的技巧", "設計蚊帳的方法", "幫助別人實現夢想", "勇敢實現助人的夢想"], "ans": 3, "why": "全文重點是凱瑟琳勇敢實現自己「幫助別人」的夢想；不是教技巧，也不是幫別人實現他們自己的夢想。", "src": "ws", "id": "c9q3"}, {"q": "課文的結尾段運用了什麼寫法？", "opts": ["總結全文，再次強調主旨", "介紹人物外貌", "描寫風景", "比較兩個人物"], "ans": 0, "why": "結尾段先統整全文成果，再用凱瑟琳的信念點出「孩子也能實現夢想，改變世界」的主旨。", "src": "ex", "id": "c9q4"}]}, {"id": "c10", "title": "夢想總整理", "scene": "🌟 🏆", "npc": "🌟", "text": "回顧凱瑟琳的故事，從一個小小的想法開始，一步一步付出行動，小小的力量也能改變世界。", "qs": [{"q": "下列何者不是凱瑟琳為了募集蚊帳所做的事？", "opts": ["請父母捐錢買蚊帳", "到二手市場義賣物品", "到社區教堂演講", "寫信向名人募款"], "ans": 0, "why": "她是自己存點心費和買玩具的錢，再義賣、演講、寫信；課文沒有說她請父母捐錢。", "src": "ws", "id": "c10q1"}, {"q": "「斧頭雖小，但經多次劈砍，終能將一棵最堅硬的橡樹砍倒。」這句話和課文的主旨有什麼關係？", "opts": ["小小的力量只要持續努力，也能完成大事", "斧頭比橡樹更重要", "應該學習砍樹", "大樹比小斧頭堅強"], "ans": 0, "why": "小斧頭象徵小小的力量，橡樹象徵困難；就像凱瑟琳一步步努力，終於幫助了許多孩子。", "src": "ex", "id": "c10q2"}], "order": {"q": "請把凱瑟琳的行動，依事情發生的先後順序排好。", "items": ["把點心費和買玩具的錢存下來買蚊帳", "和媽媽買了一頂蚊帳寄給協會", "在二手市場義賣，並設計獎狀", "到教堂和各地演講募款", "寄信和獎狀給足球明星貝克漢", "寄出一百張獎狀給全球富豪", "蓋茲基金會捐出三百萬美元"], "why": "依課文發展：存錢→寄出第一頂蚊帳→義賣與獎狀→演講→寄給貝克漢→寫信給富豪→蓋茲基金會捐款。"}, "sort": {"q": "把凱瑟琳的事，分類成「想法」或「行動」。", "buckets": ["想法", "行動"], "items": [{"t": "想為受瘧疾所苦的孩子做點什麼", "b": 0}, {"t": "相信年紀小也能做善事", "b": 0}, {"t": "希望能存更多的錢買蚊帳", "b": 0}, {"t": "把點心費存下來買蚊帳", "b": 1}, {"t": "在二手市場義賣物品", "b": 1}, {"t": "設計獎狀送給捐贈者", "b": 1}, {"t": "到各地演講募款", "b": 1}, {"t": "寫信給全球富豪", "b": 1}], "why": "「想」、「希望」、「相信」是心裡的想法；存錢、義賣、設計、演講、寫信是實際做出來的行動。"}}], "zy": {"words": [{"id": "zw01", "w": "瘧疾", "src": "ws"}, {"id": "zw02", "w": "蚊帳", "src": "ws"}, {"id": "zw03", "w": "死亡", "src": "ws"}, {"id": "zw04", "w": "存款", "src": "ws"}, {"id": "zw05", "w": "寄信", "src": "ws"}, {"id": "zw06", "w": "獎勵", "src": "ws"}, {"id": "zw07", "w": "非洲", "src": "ws"}, {"id": "zw08", "w": "募集", "src": "ex"}, {"id": "zw09", "w": "獎狀", "src": "ex"}, {"id": "zw10", "w": "贈品", "src": "ex"}, {"id": "zw11", "w": "叮嚀", "src": "ex"}, {"id": "zw12", "w": "雜誌", "src": "ex"}, {"id": "zw13", "w": "珍藏", "src": "ex"}, {"id": "zw14", "w": "捐贈", "src": "ex"}, {"id": "zw15", "w": "響應", "src": "ex"}, {"id": "zw16", "w": "感染", "src": "ex"}, {"id": "zw17", "w": "基金", "src": "ex"}, {"id": "zw18", "w": "義賣", "src": "ex"}, {"id": "zw19", "w": "保護", "src": "ex"}, {"id": "zw20", "w": "演講", "src": "ex"}, {"id": "zw21", "w": "關注", "src": "ex"}, {"id": "zw22", "w": "感謝", "src": "ex"}, {"id": "zw23", "w": "信心", "src": "ex"}, {"id": "zw24", "w": "羨慕", "src": "ex"}, {"id": "zw25", "w": "閉幕", "src     const ranked=Object.keys(SK).filter(k=>(S.stat.sk[k]||{a:0}).a>=3).sort((x,y)=>S.stat.sk[x].r/S.stat.sk[x].a-S.stat.sk[y].r/S.stat.sk[y].a);

function gSwat(){const {sb}=stageShell('S1',8);
  const ids=pickN(ALLIDS.typo,8);let idx=0;
  function round(){if(idx>=ids.length)return endStage();const t=TYPX[ids[idx]];let failed=false,phase=1;setProg(idx,ids.length);setPB(idx/ids.length);
    const chars=[...t.s];
    sb.innerHTML=progBar()+`<div id="ins">${inst('🦟','蚊子停在一個「錯別字」上！快把牠找出來，點一下字打下去。')}</div>
    <div class="wall" id="wall">${chars.map((c,i)=>isCJK(c)?`<button class="chtile" data-i="${i}">${TC(t.s,i)}</button>`:`<span class="chtile punc">${esc(c)}</span>`).join('')}<span class="mos" style="left:10%;top:10%">🦟</span><span class="mos" style="left:70%;top:60%;animation-delay:-2s">🦟</span></div>
    <div id="pal" style="display:none"><div class="inst" style="margin-bottom:.5rem"><span class="em">🕸️</span><span>${T('打到了！這個字應該改成哪一個？')}</span></div><div class="palette">${shuffle(t.opts).map(c=>`<button class="pchar" data-c="${c}">${T(c)}</button>`).join('')}</div></div>`;
    const wall=$('#wall'),tiles=$$('.chtile[data-i]',wall);
    const finish=()=>{record(t.id,!failed);sfx(!failed?'ok':'bad');idx++;
      const html=`<div class="ans">${T('「'+t.wrong+'」→「'+t.correct+'」')}</div>${T(t.s.slice(0,t.wi)+'⟦'+t.correct+'⟧'+t.s.slice(t.wi+1))}<br>${T(t.why)}`;
      sheet({ok:!failed,title:failed?'打到囉，下次更準！':'蚊子被關進蚊帳了！',html,say:t.why,onClose:()=>{if(SES.hearts<=0)endStage({dead:true});else round()}})};
    tiles.forEach(b=>b.onclick=()=>{if(phase!==1)return;const i=+b.dataset.i;
      if(i===t.wi){phase=2;sfx('whack');b.classList.add('hit');popEl(b,'啪！');wall.querySelectorAll('.mos').forEach(m=>m.style.display='none');$('#pal').style.display='';$('#ins').innerHTML=inst('🎯','找到了！接著選出正確的字。')}
      else{b.classList.add('nope');sfx('bad');failed=true;const dead=loseHeart();toast('這個字沒問題喔，再找找看');if(dead){later(()=>{sheet({ok:false,html:T(t.why),say:t.why,onClose:()=>endStage({dead:true})})},600)}}});
    $$('.pchar',sb).forEach(b=>b.onclick=()=>{if(phase!==2||b.classList.contains('gone'))return;const c=b.dataset.c;
      if(c===t.correct){phase=3;b.classList.add('ok');const tile=tiles.find(x=>+x.dataset.i===t.wi);tile.classList.remove('hit');tile.classList.add('fine');tile.innerHTML=T(t.correct);sfx('pop');later(finish,500)}
      else{b.classList.add('bad','gone');sfx('bad');failed=true;if(loseHeart()){phase=3;later(()=>{record(t.id,false);sheet({ok:false,html:T('正確答案是「'+t.correct+'」。'+t.why),say:t.why,onClose:()=>endStage({dead:true})})},500)}}});
    KEYH=null}
  round()}

/* ====== S2 同音字消消樂 ====== */
function gMatch(){const {sb}=stageShell('S2',22,{h:4});
  const fams=shuffle(D.family).slice(0,2);let fi=0,popped=0;const TOT=22;
  function board(){if(fi>=fams.length)return pairBoard();const f=fams[fi];const ids=pickN(Object.keys(FAMX).filter(k=>FAMX[k].f===f),8);let sel=null,left=ids.length;
    const tileFailed={};
    sb.innerHTML=progBar()+inst('🔤',`同音字「${f.sound}」：先點下面一個字當作筆刷，再點上面的詞語空格，填對就會消除！`)+`<div style="text-align:center"><span class="soundtag">🎵 ${f.sound} ${spk('這一組字的讀音是'+f.sound)}</span></div><div class="combo" id="combo"></div>
    <div class="board" id="bd">${ids.map(k=>{const w=FAMX[k].w;return`<button class="wtile" data-k="${k}">${T(w.w.replace(w.c,'（　　）'))}</button>`}).join('')}</div>
    <div class="dockbar"><div class="hint" style="text-align:center">${T('選一個字當作筆刷：')}</div><div class="palette" id="pl">${f.chars.map(c=>`<button class="pchar" data-c="${c}">${T(c)}</button>`).join('')}</div></div>`;
    setPB(popped/TOT);
    const pcs=$$('.pchar',sb);const choose=c=>{sel=c;pcs.forEach(b=>b.classList.toggle('sel',b.dataset.c===c));sfx('tick')};
    pcs.forEach(b=>b.onclick=()=>choose(b.dataset.c));
    KEYH=e=>{if(/^[1-5]$/.test(e.key)&&f.chars[+e.key-1])choose(f.chars[+e.key-1])};
    $$('.wtile',sb).forEach(t=>t.onclick=()=>{if(t.classList.contains('popped'))return;if(!sel){toast('先選一個字當作筆刷');return}
      const k=t.dataset.k,w=FAMX[k].w;
      if(sel===w.c){if(!tileFailed[k])record(k,true,t);t.innerHTML=T(w.w.split('').map(c=>c).join(''));t.classList.add('popped');sfx('pop');popped++;left--;setProg(popped,TOT);setPB(popped/TOT);
        const cb=SES.combo;const cm=$('#combo');if(cb>=2){cm.textContent='🔥 連擊 x'+cb;if(cb===3||cb===5||cb===8){addCoins(1,t);cm.textContent+='　額外 +1🪙'}}else cm.textContent='';
        if(left===0)later(()=>{fi++;popped=fi*8;if(fi>=fams.length){toast('最後一關：詞語配注音！');pairBoard()}else{toast('下一組同音字！');board()}},700)}
      else{t.classList.add('bad');sfx('bad');tileFailed[k]=true;SES.combo=0;$('#combo').textContent='';const q=mcq(k);
        record(k,false);const dead=loseHeart();setTimeout(()=>t.classList.remove('bad'),400);
        sheet({ok:false,html:`<div class="ans">${T('這個詞是「'+w.w+'」，要填「'+w.c+'」')}</div>${T(q.why)}`,say:q.why,onClose:()=>{if(dead)endStage({dead:true})}})}})}
  
  function pairBoard(){let ids=[],seen={};shuffle(D.zy.words).forEach(w=>{const z=zyArr(w.w).filter(Boolean).join(' ');if(ids.length<6&&!seen[z]){seen[z]=1;ids.push(w.id)}});
    const zs=ids.map(k=>zyArr(ZYWX[k].w).filter(Boolean).join(' '));const order=shuffle(ids.map((k,i)=>i));
    let selW=null,selZ=null,left=ids.length;const failed={};
    sb.innerHTML=progBar()+inst('🔡','最後一關：把「詞語」和它的「注音」配成一對！先點上面的詞語，再點下面的注音。')+`<div class="combo" id="combo"></div>
    <div class="board" id="bd">${ids.map(k=>`<button class="wtile zt" data-k="${k}">${esc(ZYWX[k].w)}</button>`).join('')}</div>
    <div class="board" id="bz">${order.map(i=>`<button class="wtile zt zz" data-k="${ids[i]}">${esc(zs[i])}</button>`).join('')}</div>`;
    setPB(popped/TOT);KEYH=null;
    const A=$$('#bd .wtile',sb),B=$$('#bz .wtile',sb);

    function fin(){const acc=SES.total?SES.ok/SES.total:0;const st=Math.max(starsOf(acc),acc>=.4?1:0);if(st>(S.ch[c.id]||0))S.ch[c.id]=st;addXP(st*8);recalc();
      if(st>=2)sfx('win');if(allDone()&&st>=1&&!S.allch){S.allch=1;confetti(40)}
      sb.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3rem">${st>=2?'🎉':st>=1?'👍':'💪'}</div><h3>${T(c.title)}　${st>=1?'通過！':'再試一次吧'}</h3>${starsHTML(st)}<div class="hint">答對 ${SES.ok} 題　答錯 ${SES.bad} 題　${SES.coins?'🪙 +'+SES.coins:''}</div><div class="row" style="justify-content:center;margin-top:.6rem"><button class="btn w" id="l">🗺️ 章節表</button><button class="btn p" id="r">🔁 重玩本章</button>${i+1<D.read.length?'<button class="btn g big" id="n">下一章 ▶</button>':'<button class="btn g big" id="h">🏠 回地圖</button>'}</div></div>`;
      $('#l').onclick=list;$('#r').onclick=()=>chapter(i);const n=$('#n');if(n)n.onclick=()=>chapter(i+1);const h=$('#h');if(h)h.onclick=hub}}
  function orderTask(c,done){const o=c.order;const items=shuffle(o.items.map((t,i)=>({t,i})));let n=0,mist=0;
    sb.innerHTML=inst('🔢',o.q+'　依序點選，第一件事先點！')+`<div class="ordl" id="ol">${items.map(it=>`<button class="ordi" data-i="${it.i}"><span class="n">?</span><span>${T(it.t)}</span></button>`).join('')}</div>`;
    $$('.ordi',sb).forEach(b=>b.onclick=()=>{if(b.classList.contains('ok'))return;const i=+b.dataset.i;
      if(i===n){b.classList.add('ok');b.querySelector('.n').textContent=n+1;n++;sfx('pop');
        if(n===items.length){record('c10order',mist===0);sfx(mist?'bad':'ok');later(()=>sheet({ok:mist===0,title:mist?'排好了！再看看順序':'順序全對！',html:`<div class="ans" style="font-size:1rem">${o.items.map((t,k)=>(k+1)+'. '+T(t)).join('<br>')}</div>${T(o.why)}`,say:o.why,onClose:done}),500)}}
      else{mist++;b.classList.add('bad');sfx('bad');setTimeout(()=>b.classList.remove('bad'),400);toast('這件事還不是現在喔')}})}
  function sortTask(c,done){const o=c.sort;const items=shuffle(o.items);let k=0,mist=0;const lists=[[],[]];
    function show(){if(k>=items.length){record('c10sort',mist===0);sfx(mist?'bad':'ok');return sheet({ok:mist===0,title:mist?'分好了！看看解析':'全部分對！',html:`<div class="ans">${o.buckets.map((b,x)=>T(b+'：'+o.items.filter(z=>z.b===x).map(z=>z.t).join('；'))).join('<br>')}</div>${T(o.why)}`,say:o.why,onClose:done})}
      sb.innerHTML=inst('🧩',o.q)+`<div class="sorti">${T(items[k].t)}</div><div class="row" style="justify-content:center">${o.buckets.map((b,x)=>`<button class="btn ${x?'r':'b'} big" data-b="${x}">${T(b)}</button>`).join('')}</div><div class="buckets">${o.buckets.map((b,x)=>`<div class="bucket"><h4>${T(b)}</h4>${lists[x].map(t=>`<div class="hint" style="line-height:1.9">• ${T(t)}</div>`).join('')}</div>`).join('')}</div>`;
      $$('[data-b]',sb).forEach(bt=>bt.onclick=()=>{const x=+bt.dataset.b;if(x===items[k].b){lists[x].push(items[k].t);k++;sfx('pop');show()}else{mist++;sfx('bad');bt.classList.add('gone');toast('再想一想：是心裡想的，還是實際做的？');setTimeout(()=>bt.classList.remove('gone'),600)}})}
    show()}
  list()}

/* ====== 綜合題（Boss／錯題練習共用） ====== */
function mixIds(n){const gs=['zy','typo','fam','poly','idiom','phrase','sent','read'];const out=[];let g=0,guard=0;
  while(out.length<n&&guard++<200){const id=pickN(ALLIDS[gs[g%gs.length]].filter(x=>!out.includes(x)),1)[0];if(id)out.push(id);g++}return shuffle(out)}
function gBoss(){quizRun({stage:'S8',ids:mixIds(10),title:'👑 瘧疾蚊王',hearts:4,boss:true})}
function quizRun(o){const N=o.ids.length;if(!N){toast('目前沒有可以練習的題目');return notebook('wrong')}
  startSession(o.stage,o.hearts||3);const el=go(`${hudHTML({title:o.title,hearts:true,prog:'0/'+N})}<div class="stagebody" id="sb"></div>`,'stage');bindBack();const sb=$('#sb',el);
  let i=0,hint=2,coil=2;
  function next(){if(SES.hearts<=0)return endStage({dead:true});if(i>=N)return endStage({extra:o.boss?'<div class="card" style="max-width:26rem">👑 瘧疾蚊王被打倒了！非洲的孩子安全多了。</div>':''});
    setProg(i,N);const q=mcq(o.ids[i]);
    sb.innerHTML=(o.boss?`<div class="bosshead"><div class="bossface" id="bf">${i>=N-1?'😈':'🦟'}</div><div style="flex:1"><div style="font-weight:900">${T('瘧疾蚊王')}　${T('體力')}</div><div class="hpbar" style="max-width:none"><i id="hp" style="width:${(N-i)/N*100}%"></i></div></div></div>`:progBar())+`<div class="powers"><button class="btn p sm" id="pc" ${coil?'':'disabled'}>🦟 蚊香（刪 2 個）×${coil}</button><button class="btn b sm" id="ph" ${hint?'':'disabled'}>🔍 提示 ×${hint}</button></div><div class="hint" id="th" style="min-height:1.6rem"></div><div id="qh"></div>`;
    if(!o.boss)setPB(i/N);
    const h=renderMCQ($('#qh'),q,{onAnswer:ok=>{if(ok){const bf=$('#bf');if(bf)bf.classList.add('hit');const hp=$('#hp');if(hp)hp.style.width=((N-i-1)/N*100)+'%'}else{loseHeart();const bf=$('#bf');if(bf)bf.classList.add('atk')}},onDone:()=>{i++;next()}});
    $('#pc').onclick=()=>{if(!coil)return;if(h.remove2()){coil--;$('#pc').textContent='🦟 蚊香（刪 2 個）×'+coil;if(!coil)$('#pc').disabled=true;sfx('pop')}};
    $('#ph').onclick=()=>{if(!hint)return;hint--;$('#ph').textContent='🔍 提示 ×'+hint;if(!hint)$('#ph').disabled=true;$('#th').innerHTML='💡 '+T(q.tip||'仔細讀題目，再比對每個選項。');sfx('pop')}}
  next()}

const CL={teams:3,names:['第一組','第二組','第三組','第四組'],n:10,sec:0,types:{zy:1,typo:1,fam:1,poly:1,idiom:1,phrase:1,sent:1,read:1}};
const TCOL=['#e04848','#1f78e0','#22a653','#9b6bff'];
function classSetup(){
  const el=go(`${hudHTML({title:'🎈 全班熱氣球競速',back:true})}<div class="page"><div class="wrap"><div class="card"><h3>分組</h3><div class="seg" id="tn">${[2,3,4].map(n=>`<button data-v="${n}" class="${CL.teams===n?'on':''}">${n} 組</button>`).join('')}</div><div class="teamcfg" style="margin-top:.6rem" id="tc"></div></div>
  <div class="card"><h3>題目類型</h3><div class="chips" id="ty">${Object.keys(SK).map(k=>`<button class="tab ${CL.types[k]?'on':''}" data-k="${k}">${SK[k].e} ${SK[k].n}</button>`).join('')}</div></div>
  <div class="card"><div class="sw"><div>題數</div><div class="seg" id="qn">${[6,10,15].map(n=>`<button data-v="${n}" class="${CL.n===n?'on':''}">${n} 題</button>`).join('')}</div></div><div class="sw"><div>每題時間</div><div class="seg" id="qs">${[[0,'不限'],[20,'20 秒'],[30,'30 秒'],[45,'45 秒']].map(([v,n])=>`<button data-v="${v}" class="${CL.sec===v?'on':''}">${n}</button>`).join('')}</div></div></div>
  <div class="hint" style="margin-bottom:.6rem">${T('玩法：各組輪流回答。答對的組別，熱氣球就往前飛一格；先飛到終點、或題目結束時飛最遠的組別獲勝！可用鍵盤 1～4 或 A～D 選答案。答題不會計入個人學習紀錄。')}</div>
  <div class="row" style="justify-content:center"><button class="btn g big" id="st">🚀 開始比賽</button></div></div></div>`,'stage');
  bindBack(hub);
  const drawT=()=>{$('#tc',el).innerHTML=Array.from({length:CL.teams},(_,i)=>`<label class="tpill" style="background:${TCOL[i]}">🎈<input data-i="${i}" value="${esc(CL.names[i])}" maxlength="6" style="width:6rem;margin-left:.3rem"></label>`).join('');$$('#tc input',el).forEach(x=>x.oninput=()=>{CL.names[+x.dataset.i]=x.value.trim()||('第'+(+x.dataset.i+1)+'組')})};drawT();
  const seg=(id,key,cb)=>$$('#'+id+' button',el).forEach(b=>b.onclick=()=>{CL[key]=+b.dataset.v;$$('#'+id+' button',el).forEach(x=>x.classList.toggle('on',x===b));if(cb)cb()});
  seg('tn','teams',drawT);seg('qn','n');seg('qs','sec');
  $$('#ty button',el).forEach(b=>b.onclick=()=>{const k=b.dataset.k;const cnt=Object.values(CL.types).filter(Boolean).length;if(CL.types[k]&&cnt<=1){toast('至少要選一種題型');return}CL.types[k]=CL.types[k]?0:1;b.classList.toggle('on',!!CL.types[k])});
  $('#st').onclick=()=>{getAC();classPlay()}}
function classPlay(){
  const pool=shuffle([].concat(...Object.keys(CL.types).filter(k=>CL.types[k]).map(k=>ALLIDS[k])));
  const ids=[];const perType={};pool.forEach(id=>{if(ids.length<CL.n){ids.push(id)}});
  const N=ids.length,T_=CL.teams,teams=Array.from({length:T_},(_,i)=>({n:CL.names[i],c:TCOL[i],s:0}));let i=0,tm=null;
  const el=go(`<div class="hud"><button class="ibtn" id="hBack">⬅️</button><div class="title-h">🎈 全班熱氣球競速</div><div class="grow"></div><span class="pill" id="prog">0/${N}</span></div><div class="stagebody" id="sb" style="font-size:1.15em"></div>`,'stage');
  bindBack(()=>confirmBox('結束比賽？','目前的比分不會保留。','結束',classSetup));const sb=$('#sb',el);
  function race(){return`<div class="race">${teams.map((t,k)=>`<div class="rtrack"><span class="tn" style="color:${t.c}">${esc(t.n)}</span><div class="lane2"><span class="bal" id="bal${k}" style="left:${4+t.s/N*88}%">🎈</span></div><b style="width:2.4rem">${t.s}</b></div>`).join('')}</div>`}
  function next(){if(i>=N)return finish();setProg(i,N);const t=teams[i%T_],q=mcq(ids[i]);
    sb.innerHTML=race()+`<div style="text-align:center"><span class="tpill" style="background:${t.c}">🎯 輪到：${esc(t.n)}</span></div>${CL.sec?'<div class="timerbar"><i id="tb" style="width:100%"></i></div>':''}<div id="qh"></div>`;
    const h=renderMCQ($('#qh'),q,{norec:true,tag:true,onAnswer:ok=>{if(tm)tm();if(ok){t.s++;const b=$('#bal'+(i%T_));if(b)b.style.left=(4+t.s/N*88)+'%';sfx('win')}},onDone:()=>{i++;if(teams.some(x=>x.s>=N))i=N;next()}});
    if(CL.sec){let left=CL.sec;const tb=$('#tb');tm=loop(dt=>{left-=dt;tb.style.width=Math.max(0,left/CL.sec*100)+'%';tb.style.background=left<CL.sec*.25?'var(--coral)':left<CL.sec*.5?'var(--sun2)':'var(--green)';if(left<=0){tm();tm=null;h.timeout()}})}}
  function finish(){const rk=teams.slice().sort((a,b)=>b.s-a.s);const top=rk[0].s;S.cls++;saveNow();checkBadges();sfx('win');confetti(40);
    sb.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3.4rem">🏆</div><h2>比賽結束！</h2>${rk.map((t,k)=>`<div class="tpill" style="background:${t.c};margin:.2rem;font-size:${1.6-k*.1}rem">${['🥇','🥈','🥉','4️⃣'][k]} ${esc(t.n)}　${t.s} 分${t.s===top?'　👑':''}</div><br>`).join('')}<div class="row" style="justify-content:center;margin-top:.6rem"><button class="btn w" id="mp">🗺️ 回地圖</button><button class="btn g big" id="ag">🔁 再比一場</button><button class="btn b" id="cf">⚙️ 重新設定</button></div></div>`;
    $('#mp').onclick=hub;$('#ag').onclick=classPlay;$('#cf').onclick=classSetup}
  next()}

/* 「往下滑」提示：目前這一頁下面還有內容時，浮出一個會跳動的按鈕，點一下就自動往下 */
(function(){const cue=document.createElement('button');cue.className='scrollcue';cue.innerHTML='👇 還有喔，往下看';document.body.appendChild(cue);let sc=null;
  function find(){const scr=[...document.querySelectorAll('#app .screen')].pop();if(!scr)return null;let best=null;
    scr.querySelectorAll('*').forEach(e=>{if(e.scrollHeight>e.clientHeight+24&&e.clientHeight>120){const o=getComputedStyle(e).overflowY;if(o==='auto'||o==='scroll'){if(!best||e.clientHeight>best.clientHeight)best=e}}});return best}
  function upd(){if(document.querySelector('.sheetbg,.modalbg')){cue.classList.remove('show');return}
    sc=find();if(!sc){cue.classList.remove('show');return}
    const left=sc.scrollHeight-sc.scrollTop-sc.clientHeight;
    if(left>24){const r=sc.getBoundingClientRect();const dk=sc.querySelector('.dockbar');const dh=dk?dk.offsetHeight:0;cue.style.bottom=Math.max(8,innerHeight-r.bottom+dh+8)+'px';cue.classList.add('show')}else cue.classList.remove('show')}
  cue.onclick=()=>{if(sc)sc.scrollBy({top:Math.max(160,sc.clientHeight*.7),behavior:'smooth'})};
  document.addEventListener('scroll',upd,true);window.addEventListener('resize',upd);setInterval(upd,350)})();
